<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookly - Meus Pedidos</title>
  <link rel="stylesheet" href="../../styles/base/base.css">
  <link rel="stylesheet" href="../../styles/meus-pedidos/meus-pedidos.css">
  <script src="../../assets/js/theme.js"></script>
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="top-header">
    <a href="../marketplace/marketplace.html" class="bookly-logo">
      <span class="l-b">B</span>oo<span class="l-k">k</span><span class="l-l">L</span>y
    </a>
    <nav class="nav-right" id="nav-right">
      <a href="../marketplace/marketplace.html" class="btn-voltar-marketplace">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Marketplace</span>
      </a>
    </nav>
  </header>

  <main class="pedidos-container">
    <h1 class="pedidos-title">Meus Pedidos</h1>
    <p class="pedidos-subtitle">Histórico de livros que você já comprou no Bookly.</p>

    <p id="pedidos-status" class="pedidos-status">Carregando pedidos...</p>

    <div class="pedidos-lista" id="pedidos-lista"></div>
  </main>

  <template id="pedido-card-template">
    <div class="pedido-card">
      <div class="pedido-info">
        <h3 class="pedido-livro"></h3>
        <p class="pedido-autor"></p>
        <p class="pedido-detalhes"></p>
      </div>
      <div class="pedido-preco"></div>
    </div>
  </template>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/toast.js"></script>
  <script src="../../assets/js/menu-usuario.js"></script>
  <script src="meus-pedidos.js"></script>
</body>
</html>
