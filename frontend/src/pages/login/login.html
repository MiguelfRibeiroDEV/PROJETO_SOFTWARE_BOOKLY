<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Bookly</title>
  <link rel="stylesheet" href="../../styles/base/base.css">
  <link rel="stylesheet" href="../../styles/login/login.css">
  <script src="../../assets/js/theme.js"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1 class="bookly-logo logo-big">
        <span class="l-b">B</span>oo<span class="l-k">k</span><span class="l-l">L</span>y
      </h1>
      <p class="welcome-text">Bem-vindo de volta! Acesse sua conta.</p>
    </div>

    <form id="login-form">
      <div class="input-group">
        <label for="email">E-mail ou Usuário</label>
        <input type="text" id="email" placeholder="seu@email.com ou nome de usuário" required autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Senha</label>
        <div class="input-password-wrap">
          <input type="password" id="password" placeholder="Digite sua senha" required autocomplete="current-password">
          <button type="button" class="btn-toggle-pass" id="btn-toggle-pass" aria-label="Mostrar ou ocultar senha" title="Mostrar/ocultar senha">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="3" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="login-links">
        <a href="../recuperar-senha/recuperar-senha.html" class="link-esqueceu">Esqueceu a senha?</a>
      </div>

      <p id="login-error" class="form-error" hidden></p>

      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <div class="login-footer">
      <p>Não tem uma conta? <a href="../register/register.html">Crie uma agora</a></p>
    </div>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/toast.js"></script>
  <script src="login.js"></script>
</body>
</html>
