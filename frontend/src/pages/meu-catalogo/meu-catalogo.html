<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookly - Meu Catálogo</title>
  <link rel="stylesheet" href="../../styles/base/base.css">
  <link rel="stylesheet" href="../../styles/meu-catalogo/meu-catalogo.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="top-header">
    <a href="../marketplace/marketplace.html" class="bookly-logo">
      <span class="l-b">B</span>oo<span class="l-k">k</span><span class="l-l">L</span>y
    </a>
    <nav class="nav-right">
      <a href="../cadastro-livro/cadastro.html" class="nav-link">Vender livro</a>
      <a href="../marketplace/marketplace.html" class="nav-link">Marketplace</a>
      <a href="../painel-vendedor/painel.html" class="nav-link">Painel de vendas</a>
    </nav>
  </header>

  <main class="catalogo-container">
    <h1 class="catalogo-title">Meu Catálogo</h1>
    <p class="catalogo-subtitle">Gerencie os livros que você anunciou no marketplace: edite informações, preço ou remova um anúncio.</p>

    <p id="catalogo-status" class="catalogo-status">Carregando catálogo...</p>

    <div class="catalogo-lista" id="catalogo-lista"></div>
  </main>

  <template id="catalogo-card-template">
    <article class="catalogo-card">
      <div class="catalogo-cover"><img alt="Capa do livro"></div>
      <div class="catalogo-info">
        <div class="catalogo-header">
          <h3 class="catalogo-titulo"></h3>
          <span class="catalogo-preco"></span>
        </div>
        <p class="catalogo-autor"></p>
        <p class="catalogo-meta"></p>
        <div class="catalogo-buttons">
          <button type="button" class="btn btn-outline btn-editar">Editar</button>
          <button type="button" class="btn btn-danger btn-excluir">Remover</button>
        </div>
      </div>
    </article>
  </template>

  <!-- MODAL DE EDIÇÃO -->
  <div class="modal-overlay" id="modal-editar" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>Editar anúncio</h2>
        <button type="button" class="modal-close" id="btn-fechar-modal" aria-label="Fechar">&times;</button>
      </div>

      <form id="form-editar" class="modal-form">
        <input type="hidden" id="editar-id-item">

        <div class="input-group modal-foto-group">
          <label>Foto do livro</label>
          <label class="modal-foto-upload" for="editar-foto-input">
            <span class="modal-foto-circle" id="editar-photo-circle">
              <svg id="editar-photo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" stroke="white" stroke-width="1.6"/>
                <circle cx="12" cy="13" r="3.2" stroke="white" stroke-width="1.6"/>
              </svg>
              <img id="editar-photo-preview" alt="Prévia da foto do livro" hidden>
            </span>
            <span class="modal-foto-text">Trocar foto</span>
            <input type="file" id="editar-foto-input" accept="image/*" hidden>
          </label>
        </div>
        <div class="input-group">
          <label for="editar-titulo">Título do livro</label>
          <input type="text" id="editar-titulo" required>
        </div>

        <div class="input-group">
          <label for="editar-autor">Autor</label>
          <input type="text" id="editar-autor" required>
        </div>

        <div class="modal-grid">
          <div class="input-group">
            <label for="editar-editora">Editora</label>
            <input type="text" id="editar-editora">
          </div>

          <div class="input-group">
            <label for="editar-ano">Ano de publicação</label>
            <input type="number" id="editar-ano" min="1400" max="2100">
          </div>
        </div>

        <div class="modal-grid">
          <div class="input-group">
            <label for="editar-categoria">Categoria</label>
            <select id="editar-categoria" required></select>
          </div>

          <div class="input-group">
            <label for="editar-idioma">Idioma</label>
            <select id="editar-idioma">
              <option value="">—</option>
              <option>Português (BR)</option>
              <option>Inglês</option>
              <option>Espanhol</option>
              <option>Francês</option>
              <option>Japonês</option>
            </select>
          </div>
        </div>

        <div class="modal-grid">
          <div class="input-group">
            <label for="editar-preco">Preço (R$)</label>
            <input type="number" id="editar-preco" step="0.01" min="0" required>
          </div>

          <div class="input-group">
            <label for="editar-conservacao">Condição</label>
            <select id="editar-conservacao">
              <option value="">—</option>
              <option>Perfeito</option>
              <option>Bom</option>
              <option>Médio</option>
              <option>Ruim</option>
              <option>Péssimo</option>
            </select>
          </div>
        </div>

        <p id="modal-erro" class="form-error" hidden></p>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancelar-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-modal">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/menu-usuario.js"></script>
  <script src="meu-catalogo.js"></script>
</body>
</html>
